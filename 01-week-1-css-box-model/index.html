<!doctype html>
<!-- tyrese Grandy -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSS Box Model</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1, h2 {
            text-align: center;
        }

        section {
            box-sizing: border-box;
            width: 80%;
            max-width: 600px;
            margin: 24px auto;
            padding: 20px;
            border: 2px solid #444;
        }
    </style>
</head>
<body>
    <header>
        <h1>CSS Box Model</h1>
    </header>

    <main>
        <section>
            <h2>This is box 1</h2>
            <p>There is content here.</p>
        </section>

        <section>
            <h2>This is box 2</h2>
            <p>There is content here.</p>
        </section>
    </main>
</body>
</html>
